# KitAppTestPublic's process checks, from dotnet-agent-kit's shared workflow: the PR title, commit subjects,
# red-to-green order and ADR sections. It also runs when the PR is edited, because the title becomes the
# merge commit's subject. Pinned like ci.yml.
name: App checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    uses: DerekFoulk/dotnet-agent-kit/.github/workflows/app-checks.reusable.yml@3f492a1f0c6ac4b31796c2bf4f4d4f810d4a8461 # unreleased
